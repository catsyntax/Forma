name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxcb-cursor0
      - name: Install Forma
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Import check (no window)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import forma.app, forma.nodes.analysis, forma.exchange; print('imports ok')"
      - name: Tests
        run: python -m pytest -q tests
